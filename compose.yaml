services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: agent
    volumes: [business_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U agent -d agent"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://agent:${POSTGRES_PASSWORD}@db:5432/agent
      RUNTIME_DIR: /app/runtime
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Set DEMO_PASSWORD}
    volumes: [agent_runtime:/app/runtime]
    depends_on:
      db: {condition: service_healthy}
    command: [sh, -c, "python -m alembic upgrade head && python -m backend.seed && exec python -m uvicorn api.server:app --host 0.0.0.0 --port 8000 --workers 1"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready')"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:8080:80"]
    depends_on:
      backend: {condition: service_healthy}
volumes:
  business_data:
  agent_runtime:
